<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 포트폴리오 챗봇</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1>AI 포트폴리오 챗봇</h1>
            <p>손관주에 대해 궁금한 점을 무엇이든 물어보세요.</p>
        </header>
        <div class="chat-box" id="chat-box">
            <div class="message bot-message">
                <p>안녕하세요! 저는 손관주의 경험과 역량을 기반으로 답변하는 AI 챗봇입니다. 궁금한 점을 물어보세요. (예: "PM으로서의 역량은?", "가장 기억에 남는 프로젝트는?")</p>
            </div>
        </div>
        <footer class="chat-footer">
            <form id="message-form" class="message-form">
                <input type="text" id="message-input" placeholder="메시지를 입력하세요..." autocomplete="off">
                <button type="submit">전송</button>
            </form>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
